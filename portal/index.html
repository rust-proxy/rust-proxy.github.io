<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rust-proxy 文档</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 2rem;
    font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
  }
  h1 { margin: 0; font-size: 1.75rem; font-weight: 600; }
  p { margin: 0; color: #555; }
  .projects { display: grid; gap: 1rem; width: 100%; max-width: 40rem; }
  a.card {
    display: block;
    padding: 1.25rem 1.5rem;
    border-radius: 0.75rem;
    background: #fff;
    border: 1px solid #e0e0e0;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  a.card:hover { border-color: #3f51b5; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  a.card strong { display: block; font-size: 1.125rem; margin-bottom: .25rem; }
  a.card span { color: #666; font-size: .9375rem; }
  footer { color: #888; font-size: .8125rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #121212; color: #e8e8e8; }
    p, a.card span { color: #a0a0a0; }
    a.card { background: #1e1e1e; border-color: #333; }
    a.card:hover { border-color: #7986cb; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
    footer { color: #777; }
  }
</style>
</head>
<body>
  <header>
    <h1>rust-proxy 文档</h1>
    <p>各项目的独立文档站点。</p>
  </header>
  <main class="projects">
    <a class="card" href="/tuic/">
      <strong>TUIC</strong>
      <span>用户手册</span>
    </a>
    <a class="card" href="/config-editor/">
      <strong>配置编辑器</strong>
      <span>浏览器本地生成配置文件</span>
    </a>
    <a class="card" href="/wind/">
      <strong>Wind</strong>
      <span>中英文协议规范与设计文档</span>
    </a>
  </main>
  <footer>
    <a href="https://github.com/rust-proxy">github.com/rust-proxy</a>
  </footer>
</body>
</html>
